# Example onekeyirc configuration for one server profile.
# Copy into an owned private directory; /save rewrites supported settings.
# Default path: $XDG_CONFIG_HOME/onekeyirc/config.ini or
# $HOME/.config/onekeyirc/config.ini. Additional servers have separate profiles.
# If the new default is absent, the old 1keyirc/config.ini is reused in place.
# An explicit --config path is unchanged; no files are moved automatically.
# Paths are literal: no quotes, variables, ~ expansion, or shell commands.
# A comment starts a line; # inside a channel value is literal.
# --test-mode validates settings but makes no IRC connection or config writes.

[connection]
server=irc.ircnow.org
port=6697
# Certificate-verified TLS. A password's storage type does not change transport.
tls=true
# Empty nickname uses a valid system login name, or user as fallback.
nick=
# IRC USER field; the bouncer account is [bouncer] username.
username=
realname=onekeyirc user
# Comma-separated auto-join channels; empty keeps the server/MOTD view.
channel=#ircnow
autoconnect=false

# Direct-IRC SASL requires verified TLS, an account, and one credential source.
# Explicit bouncer modes instead derive the identity from [bouncer] fields.
# Sources: owned private plaintext file, encrypted GPG file, or inline text.
# /panel can create a GPG file using an existing local encryption key.
auth=none
auth_user=
password_file=
password_gpg_file=
password=
# Optional independent server PASS credential; choose only one source.
server_password_file=
server_password_gpg_file=
server_password=
# Inline password bytes after '=' are literal, including spaces and #/;/=.
# Nonempty inline passwords require this config to have mode 0600 or 0400.
# Credential files must be owned regular 0600/0400 files; symlinks are refused.
# Empty CA file uses the system certificate trust store.
# Custom CA: trusted nonempty regular PEM file, at most 16 MiB.
# CA symlinks are allowed; private config/credential symlinks are refused.
# This public trust bundle does not use credential-file 0600/0400 rules.
ca_file=

[history]
# Retained per-view lines: 50..5000, within the 8 MiB per-server text cap.
# Minimalist display separately caps its stream at 2048 records / 512 KiB.
lines=100

[input]
# Preserve the terminal's signal state and interrupt/quit/suspend keys.
# Set true only to enable signals; key assignments remain inherited.
use_signals=false
# direct: one Enter; review: review the log, then press Enter again to send.
# Splitting a message across multiple IRC lines always requires consent.
send_mode=direct
# Composer/command presentation. line is the default and leaves the live tail
# above one bottom input row; fullscreen uses a larger editor plus a smaller tail.
composer_mode=line
# Suggestions: common (default), history, frequent, alphabetical, contextual.
# Contextual remembers the screen that opened command entry.
command_suggestions=common
# Personal counts live only in <config_path>.commands. Automatic count-file
# reads/writes require a saved configuration; unsaved counts stay in memory
# until the first successful Save. Only canonical names/counts are stored,
# never arguments. Full history stays in RAM; test mode skips count-file I/O.

[output]
# compact: [time] <nick> text. full: include date, server and target.
format=compact
# Hide ordinary queued/paced success notices only. Errors/consent stay visible.
queue_notices=true
# Low-priority local feedback such as draft-cancel/input-cleared notices.
# Errors, byte-limit warnings and confirmations are never hidden by this.
program_messages=true
# Optional private transcript sidecar at <config_path>.log.
# Logs require an owned exact-mode-0700 parent and single-link 0600 file.
# The per-profile append cap is 16 MiB; a cap/error stops logging, not chat.
# Archive/move the file and toggle logging off/on; there is no auto-rotation.
persistent_logging=false

[session]
# Standalone runtime is always idle; preserved by the shared config format.
default_interface=idle
# Refuse a second background job in the onekeyirc/user namespace when true.
# One live job can still connect to all supported IRC servers.
single_session=false

[presence]
# Default PART reason. Empty sends a bare PART unless a command supplies text.
part_message=
# Default QUIT reason; /quit MESSAGE overrides it. Empty sends a bare QUIT.
quit_message=Client quit
# Successful backgrounding or managed terminal loss sets automatic away after detach.
background_away=true
background_away_message=Detached from terminal
# Local input inactivity before automatic away; 0 disables.
autoaway_minutes=15
autoaway_message=Idle
# Resume/local input clears only client-generated away state. Manual /away is preserved.

[autocommands]
# At most 16 literal single-line commands, each at most 511 UTF-8 bytes.
# Enabled nonempty lists require TLS. Every nonempty list requires a config
# with mode 0600/0400, even disabled, because command text may contain secrets.
enabled=true
# Wait after registration and required SASL: 0..300 seconds.
delay_seconds=15
# Wait after each completed write: 2..60 seconds. Stalls never cause bursts.
interval_seconds=2
# command=/msg ChanServ OP #ircnow mynick
# Allowed: /msg TARGET TEXT, /join #channel [key], /nick NICK,
# /away [TEXT], /back and /whois NICK. No shell or variable expansion.
# Bytes after command= are literal, including trailing spaces and #/;/=.
# /autocommands edits the next connection; /cancel stops the current sequence.
# Offline test mode never executes these commands.

[mentions]
# The current nickname is always watched. Up to 32 literal words/phrases.
# word=project name

[ignore]
# Up to 32 exact nicknames or nick!user@host masks; * and ? are wildcards.
# mask=spammer
# mask=*!*@*.example

# Optional per-network bouncer profile. Use /panel or the bouncer examples.
# ZNC: auth=none, one server-password source, no SASL source.
# soju: auth=sasl, one SASL password source, no server-password source.
# auth_user is empty in both; each source contains only the bouncer password.
# The bouncer restores channels; configured channel= is not replayed.
# Automatic away is opt-in for bouncers; manual /away remains available.
[bouncer]
type=none
username=
network=
client=
automatic_away=false

# Read MANUAL.txt, SECURITY.md and doc/BOUNCERS.txt in the source archive.
# --check-config validates values/paths, not credential access or a real login.

# Optional user-selected shortcuts; deliberately no assignments by default.
# Use /bindings actions and /bindings keys, then /bind KEY ACTION.
# /save input writes the application-wide table in the primary config.
[hotkeys]
