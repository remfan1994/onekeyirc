# Example vipirc configuration for one server profile.
# Copy into a private directory before using. Settings is app-wide: select
# any saved server to edit it without switching chat. Settings > New server
# or Servers > New adds a session. Explicit Save writes its separate profile
# and catalog beside the primary config. Enable autoconnect separately for
# every desired startup server; its channels/authentication stay in its file.
# /save generates this format again and replaces custom comments/formatting.
# Paths are literal: no quotes, ~ expansion, variables, or shell commands.
# A comment starts a line; # inside channel=#ircnow remains part of its value.
# Try this configuration with vipirc --test-mode --config /absolute/config.ini.
# Test mode reads settings without contacting a server or reading secret files.
# Inline password values are parsed as settings but never used in test mode.
# /save is disabled in test mode; edit this file and restart to keep changes.

[connection]
# Host or numeric IP address only. Ports have their own setting.
server=irc.ircnow.org
port=6697
# Transport encryption, independent of password storage. Removing a password
# does not turn TLS on or off. The Settings Transport field edits this value.
tls=true

# Empty nick prompts, offering the system login name as the default.
nick=
# Empty username uses the system login username for the IRC USER field.
# IRC USER field; the bouncer account is [bouncer] username.
username=
realname=vipirc user

# Comma-separated auto-join list, without spaces. Empty means server view.
channel=#ircnow
# true connects to this saved server at interactive startup.
autoconnect=false

# auth is none or sasl. Direct SASL needs tls=true, auth_user and ONE source.
# Explicit bouncer modes derive the identity from [bouncer]; auth_user is empty.
# Choose a private plaintext file, encrypted GPG file, or inline password.
# Leave the other two empty; there is no fallback or extension detection.
auth=none
auth_user=
password_file=
password_gpg_file=
password=

# Optional separate server PASS password; also requires tls=true.
server_password_file=
server_password_gpg_file=
server_password=
# Inline password/server_password bytes after '=' are literal, including
# leading/trailing spaces, additional '=', '#', and ';'. No quotes/escapes.
# If either is nonempty this config must be your regular 0600/0400 file.
# Both file sources require your regular 0600/0400 file; symlinks refused.
# GPG ciphertext <=64 KiB, gpg >=2.2.20 and an already unlocked agent.
# Plain/decrypted password: one line <=1024 bytes; server PASS <=503 bytes.
# Unlock outside vipirc, then /connect; test/check-config never run GPG.
# Empty uses the system CA store. A value selects a trusted PEM CA file.
# Custom CA: trusted nonempty regular PEM file, at most 16 MiB.
# CA symlinks are allowed; private config/credential symlinks are refused.
# This public trust bundle does not use credential-file 0600/0400 rules.
ca_file=

[interface]
user_list=true
# App-wide Interface preference: mouse caret, nick menus, #channel links,
# chooser clicks and scrolling. Clear/Send are hidden when mouse is off.
mouse=true
# Optional usage hints; errors, safety warnings and controls remain visible.
hints=true
# Show F1..F6 beside top-bar categories. The keys still work when false.
shortcut_labels=true
# Arrows and hjkl always navigate outside text editors.
# Focus uses bold outlines while preserving the terminal's normal colors.
# Legacy keymap/focus_style entries are accepted but ignored and not generated.
# Per-view retained line cap: 50..5000. An 8 MiB text cap applies per server.
history_lines=500

[input]
# Preserve the terminal's signal state and interrupt/quit/suspend keys.
# Set true only to enable signals; key assignments remain inherited.
use_signals=false
# Minimalist vipirc -i: direct sends with one Enter; review adds chat review.
# Full ncurses presentation keeps its own existing send interaction.
send_mode=direct
# Minimalist vipirc -i composer/command presentation. line is the default and
# keeps one bottom input row beneath a live tail; fullscreen uses a larger editor.
composer_mode=line
# Suggestions: common (default), history, frequent, alphabetical, contextual.
# Contextual remembers the screen that opened command entry.
command_suggestions=common
# Per-server usage counts live only in <config_path>.commands. Automatic
# count-file reads/writes require a saved configuration; unsaved counts stay
# in memory until the first successful Save. Only canonical names/counts
# are stored, never arguments. Full history stays in RAM; test mode skips I/O.

[output]
# Minimalist vipirc -i: compact chat lines show time, sender, and message.
# full includes date, server, and target context on every record.
format=compact
# Hide routine queued/paced acknowledgments only; errors and send consent stay.
# Global across all servers; /set queue_notices off changes it interactively.
queue_notices=true
# Hide low-priority local feedback such as draft-cancel/input-cleared notices.
# Errors, byte-limit warnings and send confirmations always remain visible.
program_messages=true
# Optional transcript sidecar at <config_path>.log. The client requires an
# owned regular 0600 file and refuses symlinks/unsafe existing files.
# Logs require an owned exact-mode-0700 parent and single-link 0600 file.
# The per-profile append cap is 16 MiB; a cap/error stops logging, not chat.
# Archive/move the file and toggle logging off/on; there is no auto-rotation.
persistent_logging=false

[session]
# Next fresh vipirc launch; -i or -N overrides one invocation.
default_interface=ncurses
# When true, refuse a second background job in this program/user namespace.
# One live job can still connect to all supported IRC servers.
single_session=false

[presence]
# Default PART reason. Empty sends a bare PART unless a command supplies text.
part_message=
# Default QUIT reason; /quit MESSAGE overrides it. Empty sends a bare QUIT.
quit_message=Client quit
# Successful backgrounding or managed terminal loss sets automatic away after detach.
background_away=true
background_away_message=Detached from terminal
# Local input inactivity before automatic away; 0 disables.
autoaway_minutes=15
autoaway_message=Idle
# Resume/local input clears only client-generated away state. Manual /away is preserved.

[autocommands]
# Optional sequence for this server after registration and required SASL.
# At most 16 literal single-line commands, each at most 511 UTF-8 bytes.
# Enabled nonempty lists require TLS. Any nonempty list requires this config
# to have mode 0600/0400, even when disabled; commands may contain passwords.
enabled=true
# Initial delay 0..300 seconds; later commands 2..60 seconds after completed
# transmission. A stalled connection does not send a catch-up burst.
delay_seconds=15
interval_seconds=2
# command=/msg ChanServ OP #ircnow mynick
# Supported: /msg TARGET TEXT, /join #channel [key], /nick NICK,
# /away [TEXT], /back, /whois NICK. No shell or variable expansion.
# command= preserves literal bytes after '=', including trailing spaces.
# Edit through /autocommands; /save persists changes for the next connect.
# /cancel stops this connection's remaining commands. Test mode runs none.

[mentions]
# The current nickname is always matched automatically.
# Uncomment literal custom strings to add matches. Maximum 32, 127 bytes each.
# word=project name
# word=another literal phrase

[ignore]
# Local user PRIVMSG/NOTICE filters; maximum 32 masks, 127 ASCII bytes each.
# Use an exact nickname, or full nick!user@host with * and ? wildcards.
# Nick uses IRC case rules; user/host match ASCII case-insensitively.
# mask=spammer
# mask=*!*@*.example

# Optional per-network bouncer profile. Use /panel or the bouncer examples.
# ZNC: auth=none, one server-password source, no SASL source.
# soju: auth=sasl, one SASL password source, no server-password source.
# auth_user is empty in both; each source contains only the bouncer password.
# The bouncer restores channels; configured channel= is not replayed.
# Automatic away is opt-in for bouncers; manual /away remains available.
[bouncer]
type=none
username=
network=
client=
automatic_away=false

# Read MANUAL.txt, SECURITY.md and doc/BOUNCERS.txt in the source archive.
# --check-config validates values/paths, not credential access or a real login.

# Optional user-selected shortcuts; deliberately no assignments by default.
# Use /bindings actions and /bindings keys, then /bind KEY ACTION.
# /save input writes the application-wide table in the primary config.
[hotkeys]
