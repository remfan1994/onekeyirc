# Partial profile for either client; replace example values before connecting.
# The encrypted file contains only the bouncer password, not user/network:pass.
# Keep this profile in an owned 0700 directory with file mode 0600.
# These examples use absolute paths; relative paths use the launch directory.
# Paths are literal: no quotes, variables or tilde expansion.
# Bouncer account/network/client: <=63 ASCII letters, digits, dot, _ or -.
# [connection] username is IRC USER; [bouncer] username is the login account.
# Leave auth_user empty. Choose exactly one credential source for this mode.
[connection]
server=example.ircnow.org
port=31337
tls=true
nick=mynick
autoconnect=false
auth=none
# No SASL password source here. The client builds the combined ZNC PASS.
server_password_gpg_file=/home/me/.config/onekeyirc/credentials/bouncer.gpg

# Omitted ca_file uses system trust. A custom PEM must be nonempty,
# regular and <=16 MiB; public CA symlinks are allowed, secret symlinks are not.

[bouncer]
type=znc
username=myaccount
network=ircnow
client=laptop
# Let the bouncer coordinate other devices; manual /away is still possible.
automatic_away=false

# Existing network membership is restored by the bouncer after login.
# See doc/BOUNCERS.txt for controls, replay limits and troubleshooting.

# Optional user-selected shortcuts; deliberately no assignments by default.
# Use /bindings actions and /bindings keys, then /bind KEY ACTION.
# /save input writes the application-wide table in the primary config.
[hotkeys]
